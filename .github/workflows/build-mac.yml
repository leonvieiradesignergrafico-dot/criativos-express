name: Build Mac Installer

# Builda o Ads Express no macOS (na nuvem do GitHub) e publica o .dmg na página de
# Releases. Assim ninguém precisa buildar localmente: o usuário só baixa o instalador.
#
# Dispara manualmente (aba Actions -> "Build Mac Installer" -> Run workflow) ou via
# `gh workflow run build-mac.yml -f version=1.1.0`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex.: 1.1.0)"
        required: true
        default: "1.1.0"

permissions:
  contents: write        # necessário pra criar/atualizar a Release

jobs:
  build:
    runs-on: macos-latest            # runner Apple Silicon (arm64)
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Injetar credencial do Veo (service account)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # A chave da service account NÃO fica no git (é secret). Aqui ela é escrita
          # dentro de packaging/default_config/, que os dois specs empacotam como
          # _default_config/. Assim o app e o instalador saem com o Google já configurado
          # (o instalador ativa a chave; o backend também sabe usá-la). Sem o secret, o
          # build sai sem credencial (cai no login manual do gcloud, como antes).
          if [ -n "${GCP_SA_KEY:-}" ]; then
            printf '%s' "$GCP_SA_KEY" > packaging/default_config/veo_sa.json
            python -c "import json;json.load(open('packaging/default_config/veo_sa.json'));print('veo_sa.json OK')" \
              || { echo 'ERRO: GCP_SA_KEY não é JSON válido.'; exit 1; }
          else
            echo 'AVISO: secret GCP_SA_KEY vazio — build SEM credencial embutida (login manual).'
          fi

      - name: Buildar o app + o instalador premium + o .dmg
        env:
          ADSEXPRESS_VERSION: ${{ github.event.inputs.version }}
          # Runner é Apple Silicon (arm64). Buildar arm64 (não universal2) evita o erro
          # "not a fat binary" das libs single-arch (Pillow etc.). Cobre Macs M1/M2/M3.
          ADSEXPRESS_ARCH: arm64
        run: |
          set -e
          chmod +x packaging/mac/*.sh 2>/dev/null || true
          # build_mac.sh: venv + deps + app + instalador (Ads Express Installer.app)
          bash packaging/mac/build_mac.sh
          # create_dmg.sh: empacota o instalador dentro do .dmg
          bash packaging/mac/create_dmg.sh
          echo "== artefatos gerados =="
          ls -la *.dmg dist 2>/dev/null || true

      # --- PORTÃO DE QUALIDADE ------------------------------------------------
      # O runner É um Mac: dá pra rodar o app JÁ CONGELADO aqui e provar que ele
      # funciona antes de virar release. Sem isto, o único teste era o Leon instalar
      # o .dmg e rodar o pipeline inteiro até quebrar no último passo (foi assim que
      # o CERTIFICATE_VERIFY_FAILED da geração de clipes apareceu).
      - name: Instalar gcloud (para o teste ponta a ponta do Veo)
        continue-on-error: true
        run: |
          set -e
          cd "$RUNNER_TEMP"
          URL="https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-darwin-arm.tar.gz"
          curl -fsSL --retry 3 -o gcloud.tar.gz "$URL"
          tar -xzf gcloud.tar.gz
          echo "$RUNNER_TEMP/google-cloud-sdk/bin" >> "$GITHUB_PATH"

      - name: Teste de fumaça no .app buildado
        run: |
          set -e
          APP="dist/Ads Express.app/Contents/MacOS/Ads Express"
          test -x "$APP" || { echo "ERRO: binário do .app não existe em $APP"; exit 1; }
          # SMOKE_VERBOSE imprime o traceback completo de cada falha no log do Actions.
          SMOKE_VERBOSE=1 "$APP" --smoke

      - name: Teste de fumaça com o ambiente do Finder (PATH mínimo)
        run: |
          set -e
          APP="dist/Ads Express.app/Contents/MacOS/Ads Express"
          # Um .app aberto pelo Finder NÃO herda o shell do usuário: o PATH é só
          # /usr/bin:/bin:/usr/sbin:/sbin — sem Homebrew, sem npm, sem gcloud. É o gotcha
          # nº 1 de app GUI no macOS e o teste normal (rodado do terminal) o esconde.
          # Aqui reproduzimos esse ambiente pelado: o app tem que se virar sozinho
          # (workspace.py prepende os diretórios canônicos + cli_paths.env).
          env -i HOME="$HOME" USER="$USER" TMPDIR="${TMPDIR:-/tmp}"                  PATH="/usr/bin:/bin:/usr/sbin:/sbin" SMOKE_VERBOSE=1                  "$APP" --smoke

      - name: Publicar o .dmg na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
          ADSEXPRESS_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          TAG="v${ADSEXPRESS_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Ads Express ${ADSEXPRESS_VERSION}" \
              --notes "Instalador do **Mac** (build automático na nuvem). Baixe o \`.dmg\`, dê dois cliques no instalador e pronto."
          fi
          shopt -s nullglob
          enviados=0
          for f in "Ads Express "*.dmg *.dmg; do
            [ -f "$f" ] || continue
            echo "Enviando: $f"
            gh release upload "$TAG" "$f" --clobber
            enviados=$((enviados+1))
          done
          if [ "$enviados" -eq 0 ]; then
            echo "ERRO: nenhum .dmg foi gerado — veja o log do build acima." >&2
            exit 1
          fi
          echo "OK: $enviados arquivo(s) publicado(s) na Release $TAG."
