# Configuração global do Criativos Express

[geracao]
# Backend de geração de imagem:
#   "codex" -> usa o Codex CLI consumindo seu plano ChatGPT (GRÁTIS, padrão)
#   "api"   -> usa a API paga da OpenAI (gpt-image-2). Requer OPENAI_API_KEY no .env
backend = "codex"

# Tamanho padrão dos criativos (1024x1024 = quadrado, seguro em todo posicionamento)
size = "1024x1024"

# Qualidade (usada pela rota API): low | medium | high | auto
quality = "high"

# Timeout por imagem, em segundos (folga para rate-limit do plano)
timeout = 600

# TETO de imagens em paralelo (só no backend codex; api é sempre sequencial).
# O nº REAL de workers sai da QUANTIDADE de imagens do lote (_workers_balanceados em
# gerar.py), pra dividir em rodadas parelhas: 12 imgs -> 3 de 4 (não 5+5+2); 10 -> 2 de
# 5; 8 -> 2 de 4. Este valor é só o LIMITE SUPERIOR dessa conta. Fila rolante (a próxima
# entra assim que uma termina) e, se bater rate-limit, a imagem NÃO se perde: espera
# (backoff) e retenta. Suba o teto se sua máquina/plano aguentarem; baixe se quiser ser
# conservador.
workers = 6

# Esforço de raciocínio do agente Codex ao gerar imagem: minimal | low | medium | high.
# Gerar imagem NÃO precisa de raciocínio profundo (o agente só transporta o briefing
# para o $imagegen), então "low" acelera cada imagem sem perder qualidade. "" = default do CLI.
reasoning = "low"

# Modelo do Codex usado para gerar imagem. "" = usa o default do seu ~/.codex/config.toml.
# gpt-5.6-luna é o mais rápido/barato. Preencha só se quiser forçar um modelo específico.
img_model = ""


# ========================= VÍDEO UGC =========================
# Segundo caminho da ferramenta (tela inicial → "Vídeo UGC"). Reaproveita produtos,
# referências e a esteira de imagem grátis (keyframes) do bloco [geracao] acima.

[app]
# Caminho do ffmpeg ("" = usar o do PATH). Usado na montagem e no TTS.
ffmpeg = ""

[keyframes]
# Backend das imagens-chave (keyframes) do vídeo: "codex" (grátis) | "api" (pago).
backend = "codex"
size = "1024x1536"          # 9:16 nativo do $imagegen (cropado p/ 720x1280 na montagem)
timeout = 600
workers = 6                 # keyframes gerados em paralelo (6 = um roteiro inteiro de uma vez)
reasoning = "low"
img_model = ""

[video]
# Motor de animação: SEMPRE "veo" (Google Veo via Vertex AI — omni, roda no crédito Google;
# requer gcloud login). É o ÚNICO motor suportado — fal.ai/Wan/Higgsfield foram removidos.
motor = "veo"
modelo_veo = "veo_lite"   # veo_lite (veo-3.1-lite, PADRAO) | veo_fast | veo_quality
duracao_s = 5
resolution = "720p"
workers = 2
timeout = 900
# Projeto GCP do Veo. Pode ficar aqui ou em VEO_PROJECT no .env.
veo_project = "capable-fuze-506422-c2"

[video.precos_usd]
# Preço por clipe de 5s em USD (só para a ESTIMATIVA na UI). Sai do crédito grátis do Google.
# Conferido no catálogo oficial de billing (cloudbilling.googleapis.com) em 2026-08-25.
# A unidade "count" do SKU = 1 SEGUNDO de vídeo. O Veo 3.1 não tem SKU próprio: cobra nas
# faixas do Veo 3. Os SKUs do Lite ficam no serviço "Gemini API"; Fast/Quality aparecem
# nos dois serviços (Gemini API e Vertex AI) com o mesmo preço.
#   "Veo Lite Generation 720p with Audio"     = US$0,05/s  <- é o que a esteira usa
#   "Veo 3 Fast 720p Audio Video Generation"  = US$0,10/s
#   "Veo 3 Fast Video 720p Generation" (mudo) = US$0,08/s
#   "Veo 3 Audio Video Generation"            = US$0,40/s
veo_lite = 0.25     # US$0,05/s * 5s  <- padrao
veo_fast = 0.50     # US$0,10/s * 5s (era 0,75 — superestimava 50%)
veo_quality = 2.00  # US$0,40/s * 5s

[qualidade]
# Barreira automática: keyframe reprovado não consome Veo; clipe reprovado não chega à montagem.
habilitada = true
max_tentativas_keyframe = 3
max_tentativas_clipe = 3
frames_por_clipe = 16
timeout = 180
modelo = ""

[voz]
# Engine TTS: "eleven" (conta ElevenLabs própria, natural PT-BR) | "edge" (grátis, robótico,
# só rascunho) | "f5" (local GPU). Obs.: no fluxo Veo a narração vem no ÁUDIO NATIVO do Veo;
# o TTS abaixo só é usado em previews/rascunho.
engine = "eleven"
# Voz ElevenLabs BR nativa (usada quando engine="eleven"). Padrão travado: "Ana Alice"
# (jovem, casual, tom de depoimento UGC — casa com as referências da Pulseira). Trocar o
# voice_id por qualquer voz da biblioteca em elevenlabs.io/app/voice-library.
#   Alternativas já testadas e aprovadas: Roberta ohZOfA9iwlZ5nOsoY7LB | Nina M. GM2UA3fbsIaLHcswCDX9
voice_id = "ORgG8rwdAiMYRug8RJwR"
eleven_model = "eleven_multilingual_v2"
stability = 0.45
similarity = 0.8
style = 0.25
# Voz do edge (só se engine="edge").
voz_padrao = "pt-BR-FranciscaNeural"
